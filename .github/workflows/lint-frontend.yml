name: Lint & Build Frontend (Vue)

on:
  workflow_call:

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # the root package.json's engines.node, which the Toolforge
          # buildpack (heroku/nodejs) uses too: one place for the version
          # range (each side picks its own patch release within it)
          node-version-file: package.json

      - name: Node version used, and within engines.node
        run: |
          RANGE=$(node -p "require('../package.json').engines.node")
          echo "node $(node --version), engines.node $RANGE"
          npx --yes semver@7.6.3 -r "$RANGE" "$(node --version)"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # npm ci and toolforge:build: the same commands as the Toolforge build
      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npx prettier --check src/

      - name: Lint (ESLint)
        run: npx eslint src/ --ext .vue,.js,.jsx,.cjs,.mjs

      - name: Build
        run: npm run toolforge:build
